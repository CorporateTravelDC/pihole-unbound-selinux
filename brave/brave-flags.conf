# ~/.config/brave-flags.conf
#
# PURPOSE:
#   Launch flags for Brave Browser on aarch64 Pi 5 (BCM2712)
#   under GNOME Wayland.
#
# WHY:
#   Same Chromium-engine Wayland issue as Electron/Claude Desktop.
#   Explicit ozone flag required for correct rendering on BCM2712.
#
# DEPLOY:
#   cp brave/brave-flags.conf ~/.config/brave-flags.conf
#
# NOTE: Brave reads this file automatically at launch.

--ozone-platform=wayland
--enable-features=WaylandWindowDecorations
