# /etc/unbound/conf.d/60-tailscale-magicdns.conf
#
# Forward *.ts.net (Tailscale MagicDNS) queries to Tailscale's own
# recursive resolver, so this host's own local tools (curl, getent, other
# scripts) can resolve tailnet peer names -- not just external clients,
# which always resolve MagicDNS through their own Tailscale client
# regardless of this host's DNS setup.
#
# This host's system-wide resolver is Pi-hole -> Unbound; systemd-resolved
# is deliberately masked (see harden.sh), which is why Tailscale's own
# "setLinkDNS" integration can't wire itself in automatically (Tailscale's
# health check logs a setLinkDNS/resolve1 warning as a result -- harmless,
# ts.net resolution just needs this explicit forward-zone instead).
#
# 100.100.100.100 is Tailscale's fixed recursive-resolver address, reachable
# from any node on the tailnet -- not specific to this host.
#
# Deploy: sudo cp unbound/conf.d/60-tailscale-magicdns.conf /etc/unbound/conf.d/
#         sudo unbound-checkconf && sudo systemctl restart unbound

forward-zone:
    name: "ts.net."
    forward-addr: 100.100.100.100
